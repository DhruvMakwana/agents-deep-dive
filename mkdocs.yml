site_name: Agents, Deep Dive
site_description: A deep-dive reference on LLM agents — architectures, tools, context and memory, multi-agent systems, evaluation, security, durable execution, and training agents with RL.
site_author: Dhruv Makwana
# IMPORTANT: update these two before deploying to GitHub Pages.
# If this repo is published at github.com/<user>/<repo>, site_url is
# https://<user>.github.io/<repo>/ (or https://<user>.github.io/ for a user/org page repo).
site_url: https://dhruvmakwana.github.io/agents-deep-dive/
repo_url: https://github.com/dhruvmakwana/agents-deep-dive
repo_name: dhruvmakwana/agents-deep-dive
edit_uri: ""

theme:
  name: material
  palette:
    - scheme: slate
      primary: black
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: white
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github
  favicon: assets/favicon.svg

plugins:
  - search
  - tags

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      title: On this page
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
      url_download: true
      url_timeout: 10
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde

extra_css:
  - stylesheets/extra.css
  - stylesheets/quiz.css
  - stylesheets/flashcards.css

extra_javascript:
  - javascripts/quiz.js
  - javascripts/flashcards.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/dhruvmakwana

nav:
  - Home: index.md
  - Revision: revision.md
  - Foundations:
      - "What Is an Agent?": what-is-an-agent.md
      - "The Agent Loop From Scratch": agent-loop-from-scratch.md
      - "Workflow Patterns": workflow-patterns.md
      - "Reasoning Paradigms": reasoning-paradigms.md
      - "Choosing a Framework": choosing-a-framework.md
  - Tools and Context:
      - "Tool Design": tool-design.md
      - "Context Engineering": context-engineering.md
      - "Tools at Scale": tools-at-scale.md
      - "MCP Deep Dive": mcp-deep-dive.md
      - "MCP and Tool Ecosystem": mcp-tool-ecosystem.md
      - "Skills, A2A and Other Protocols": skills-a2a-protocols.md
      - "KV-Cache Economics": kv-cache-economics.md
      - "Memory Architectures": memory-architectures.md
      - "Models for Agents": models-for-agents.md
  - Systems:
      - "Planning and Decomposition": planning-and-decomposition.md
      - "Multi-Agent Systems": multi-agent-systems.md
      - "Harness Engineering": harness-engineering.md
      - "Coding Agents: Mechanisms": coding-agents-mechanisms.md
      - "Coding Agent Products and Configuration": coding-agent-config.md
      - "Deep Research Agents": deep-research-agents.md
      - "Computer-Use and Browser Agents": computer-use-browser-agents.md
      - "Personal and Always-On Agents": personal-always-on-agents.md
  - Production:
      - "Evaluating Agents": evaluating-agents.md
      - "Benchmark Atlas": benchmark-atlas.md
      - "Observability and Debugging": observability-debugging.md
      - "Agent Security": agent-security.md
      - "Guardrails and Human-in-the-Loop": guardrails-human-in-the-loop.md
      - "Identity, Governance and Compliance": identity-governance-compliance.md
      - "Sandboxes and Permissions": sandboxes-permissions.md
      - "Durable Execution": durable-execution.md
      - "Cost and Latency": cost-latency.md
  - Training:
      - "Training Agents: Reward and Credit": training-agents.md
      - "RL for Search and Tool Agents": rl-search-tool-agents.md
      - "Data and Environments": data-environments.md
  - Interview:
      - "Interview Playbook": interview-playbook.md
  - About: about.md
